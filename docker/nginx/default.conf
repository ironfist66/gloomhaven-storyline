server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the /tracker -> /tracker/ redirect relative so it does not leak
    # the container's internal host:port through the load balancer.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # OfflineChecker polls HEAD /ping every 60s and toasts
    # "Offline, changes are only stored locally." on failure.
    location = /ping { access_log off; return 200; }

    # webpack rewrites these in place each build; never cache them.
    location = /index.html         { add_header Cache-Control "no-cache"; }
    location = /tracker/index.html { add_header Cache-Control "no-cache"; }
    location = /service-worker.js  { add_header Cache-Control "no-cache"; }
    location = /manifest.json      { add_header Cache-Control "no-cache"; }

    # Filenames are stable; cache-busting is via ?v=<md5>. Safe to cache hard.
    location ~* ^/(js|css|img|svg|fonts)/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
